services:
  # 1. FastAPI Web Service
  - type: web
    name: documind-ai-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: documind-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

  # 2. React SPA Static Site
  - type: static
    name: documind-ai-frontend
    region: oregon
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://documind-ai-backend.onrender.com/api

databases:
  - name: documind-postgres
    region: oregon
    plan: starter
